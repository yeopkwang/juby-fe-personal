<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!--
    브라우저 탭 아이콘. 실제로 보이는 크기는 16px다.

    예전에는 캔들 세 개를 그렸는데, 16px로 줄이면 꼬리가 사라지고 몸통만 남아
    점 몇 개로 뭉개졌다. 떠 있는 도형 여럿은 그 크기에서 형태가 안 남는다.
    그래서 꽉 찬 타일 하나를 바닥에 깔고, 그 위에 굵은 획 하나만 올렸다.
    타일이 있으면 흰 탭이든 어두운 탭이든 아이콘의 윤곽이 항상 같게 보인다.

    색은 값을 직접 적었다. 파비콘은 문서 밖이라 CSS 변수를 못 쓴다.
    바꿀 땐 src/index.css의 짝도 같이 고친다.
      #2e7d5b = color-brand-deep (주요 버튼과 같은 초록)
      #f04452 = color-up (상승 빨강)
    (XML 주석에 이중 하이픈을 못 넣어서 변수명 앞 접두사는 생략했다.)

    끝점만 상승 빨강으로 찍었다. 선만 있으면 어느 서비스에나 있는 그래프인데,
    한국식 상승 색이 붙으면 이 앱의 색 규칙(상승 빨강, 하락 파랑)과 이어진다.
  -->
  <rect width="48" height="48" rx="12" fill="#2e7d5b" />
  <path
    d="M11 32 L20 23 L27 29 L36 16"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="36" cy="16" r="5.5" fill="#f04452" />
</svg>
