<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!--
    상승 추세 캔들차트. 색은 한국식이다 — 상승 빨강, 하락 파랑.
    src/index.css의 color-up(#f04452) / color-down(#3182f6) 변수와 같은 값을 쓴다.
    CSS 변수는 여기서 못 쓰므로(파비콘은 문서 밖이다) 값을 직접 적었다. 바꿀 땐 둘 다 고친다.
    (XML 주석에는 이중 하이픈을 못 넣어서 변수명 앞 접두사는 생략했다.)

    탭에서는 16px로 줄어든다. 몸통을 굵게(12) 잡고 꼬리를 2로 둔 건 그 크기에서
    캔들 세 개가 뭉개지지 않고 계단처럼 읽히는 최소 두께라서다.
  -->
  <g fill="#3182f6">
    <rect x="8" y="30" width="2" height="16" rx="1" />
    <rect x="3" y="34" width="12" height="9" rx="2" />
  </g>
  <g fill="#f04452">
    <rect x="23" y="16" width="2" height="22" rx="1" />
    <rect x="18" y="20" width="12" height="13" rx="2" />

    <rect x="38" y="2" width="2" height="22" rx="1" />
    <rect x="33" y="5" width="12" height="14" rx="2" />
  </g>
</svg>
