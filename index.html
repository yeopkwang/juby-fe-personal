<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      글꼴 CSS를 받으러 갈 곳을 미리 알려 둔다. 이게 없으면 아래 링크를 발견한 뒤에야
      DNS·TCP·TLS를 시작한다. 그 준비만 100ms 안팎이고, 그동안 아무것도 못 그린다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!--
      ⚠️ rel="stylesheet"가 아니라 preload로 받아 두고 다 오면 stylesheet로 바꿔 단다.
      평범한 stylesheet는 **다 받을 때까지 화면에 아무것도 안 그린다.**

      이 CSS는 gzip으로도 119KB다(@font-face 828개 = 9굵기 × 한글 자모 구간).
      JS 번들 전체(85KB)보다 크고, 그게 전부 첫 그림 앞을 막고 있었다.

      막아서 얻는 게 있으면 감수하겠는데 **없다.** 828개가 전부 font-display: swap이라
      글자는 어차피 대체 글꼴로 먼저 그려지고 나중에 바뀐다. 즉 막든 안 막든 보이는
      순서는 같고, 막으면 그 순서가 통째로 뒤로 밀릴 뿐이다.

      바꾸면 안 되는 것: crossorigin. 이게 빠지면 글꼴 파일을 다시 받는다.
      noscript는 자바스크립트가 꺼진 경우다. onload가 안 돌아 글꼴이 영영 안 붙는다.
    -->
    <link
      rel="preload"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
      />
    </noscript>

    <!--
      로고 전용으로 구글 폰트(Michroma)를 받던 자리다. 'JUBY' 네 글자 때문에
      외부 서버에 세 번 다녀왔고, 폰트가 늦게 오면 로고가 잠깐 다른 글씨로 보였다가
      바뀌었다. 지금은 글자를 도형으로 그린다 — src/components/Logo.tsx
    -->
    <title>JUBY</title>
  </head>
  <body>
    <!--
      React가 오기 전까지 여기가 비어 있어서 흰 화면이었다.

      실측(느린 회선 1.5Mbps): index.css는 420ms에 오는데 index.js는 951ms에 온다.
      그릴 것이 하나도 없어서 그 531ms를 흰 화면으로 버리고 있었다. 번들은 React와
      라우터가 대부분이라 더 줄일 여지가 없어서, 줄이는 대신 **먼저 그린다.**

      createRoot(...).render()가 첫 렌더에서 이 안을 통째로 비운다. 지울 코드가 없다.

      ⚠️ 여기에 헤더나 표 모양을 흉내 내지 않는다. 그건 화면 코드에 있는 사실을
      HTML에 한 번 더 적는 것이고, 메뉴가 하나 늘면 여기만 조용히 옛날 것이 된다.
      모양은 src/index.css의 .boot에 있다 — 색과 간격을 기존 토큰에서 가져오려고
      거기 뒀다. 여기에 style을 적으면 그 값들을 베껴 오게 된다.
    -->
    <div id="root">
      <div class="boot" role="status" aria-label="불러오는 중"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
